<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="240" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Open Book Base -->
  <g transform="translate(96, 170)">
    <!-- Left Page -->
    <path d="M 160 160 C 100 135, 30 145, 0 165 L 0 35 C 30 15, 100 05, 160 30 Z" fill="#334155" opacity="0.8"/>
    <path d="M 160 155 C 100 130, 30 140, 5 158 L 5 33 C 35 15, 100 10, 160 30 Z" fill="#f8fafc"/>
    <!-- Left page lines -->
    <line x1="30" y1="65" x2="135" y2="55" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="85" x2="135" y2="75" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="105" x2="135" y2="95" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="125" x2="105" y2="117" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 160 160 C 220 135, 290 145, 320 165 L 320 35 C 290 15, 220 05, 160 30 Z" fill="#334155" opacity="0.8"/>
    <path d="M 160 155 C 220 130, 290 140, 315 158 L 315 33 C 285 15, 220 10, 160 30 Z" fill="#f1f5f9"/>
    <!-- Right page lines -->
    <line x1="185" y1="55" x2="290" y2="65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="75" x2="290" y2="85" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="95" x2="290" y2="105" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="117" x2="260" y2="125" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>

    <!-- Spine -->
    <path d="M 160 30 L 160 160" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle / Idea / Mic Symbol Floating Above -->
  <g transform="translate(256, 120)">
    <!-- Light Bulb & Star -->
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M -12 18 L 12 18 L 8 28 L -8 28 Z" fill="#d97706"/>
    <!-- Filament Spark -->
    <path d="M 0 -18 L 4 -4 L 18 0 L 4 4 L 0 18 L -4 4 L -18 0 L -4 -4 Z" fill="#ffffff"/>
  </g>

  <!-- Note Quill / Audio Wave Badge -->
  <g transform="translate(370, 360)">
    <circle cx="0" cy="0" r="46" fill="url(#accentGrad)" filter="url(#glow)"/>
    <!-- Microphone / Voice Wave icon -->
    <rect x="-8" y="-18" width="16" height="26" rx="8" fill="#ffffff"/>
    <path d="M -16 -4 C -16 10, 16 10, 16 -4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
